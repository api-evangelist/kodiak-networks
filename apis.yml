name: Kodiak Networks
description: >-
  Kodiak Networks built a carrier-grade Push-to-Talk over Cellular (PoC) platform that wireless
  operators deployed as their own branded push-to-talk service, competing with legacy land mobile
  radio for dispatch, field-service and public-safety workforces. Motorola Solutions acquired the
  company in 2017 and the technology now ships as Motorola Solutions' "Kodiak" mission-critical
  push-to-talk (MCPTT) offering for carriers, aligned to the 3GPP SA WG6 MCPTT specifications
  (TS 23.379, TS 24.382, TS 24.482, TS 22.582) and interoperable with land mobile radio through
  Critical Connect. Kodiak Networks no longer operates independently: its legacy domain serves only
  a static "Site under maintenance" placeholder over plain HTTP, and it publishes no OpenAPI,
  developer documentation, SDKs or public API surface of its own. Broadband push-to-talk APIs for
  third-party integration do exist, but access is gated behind the Motorola Solutions Application
  Developer Program.
